[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["nivalume"]
repository = "https://github.com/nivalume/pi-rs"
homepage = "https://github.com/nivalume/pi-rs"

[workspace.dependencies]
tau-llm = { path = "crates/ai", version = "0.1.0" }

aws-config = { version = "1.12", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "credentials-process", "sso"] }
aws-sdk-bedrockruntime = { version = "1.148", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-smithy-types = "1.8"
base64 = "0.23"
bytes = "1.12"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
google-cloud-aiplatform-v1 = { version = "1.17", default-features = false, features = ["prediction-service"] }
google-cloud-auth = "1.17"
http = "1.5"
indexmap = { version = "2.14", features = ["serde"] }
jsonschema = { version = "0.59", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2", "system-proxy", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5"
uuid = { version = "1.28", features = ["v4"] }

# dev
aws-smithy-eventstream = "0.61"
pretty_assertions = "1"
tokio-test = "0.4"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the codebase's style more than they help.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
doc_markdown = "allow"
large_enum_variant = "allow"
single_match_else = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
