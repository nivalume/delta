[package]
name = "delta-ai"
description = "Unified LLM API for Rust: provider collections, auth resolution, streaming events, token and cost tracking, tool calling and cross-provider hand-off (Rust port of pi-ai)"
readme = "README.md"
keywords = ["llm", "ai", "anthropic", "openai", "gemini"]
categories = ["api-bindings", "asynchronous"]
include = ["src/**", "data/**", "docs/**", "README.md", "CHANGELOG.md", "LICENSE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "delta_ai"

[features]
default = []
# Amazon Bedrock (bedrock-converse-stream) through the official AWS SDK for Rust.
bedrock = [
    "dep:aws-config",
    "dep:aws-sdk-bedrockruntime",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-types",
]
# Vertex AI (google-vertex) through the official Google Cloud client libraries for Rust.
vertex = ["dep:google-cloud-aiplatform-v1", "dep:google-cloud-auth", "dep:google-cloud-gax"]
full = ["bedrock", "vertex"]
# The `delta-ai` login CLI (port of upstream `src/cli.ts`).
cli = []

[dependencies]
base64.workspace = true
bytes.workspace = true
futures.workspace = true
getrandom.workspace = true
http.workspace = true
indexmap.workspace = true
jsonschema.workspace = true
reqwest.workspace = true
# zstd request bodies of the OpenAI Codex SSE transport.
ruzstd.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# `net` and `io-util` serve the OAuth loopback callback server.
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-util.workspace = true
# WebSocket transport of the OpenAI Codex Responses API.
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v7"] }

aws-config = { workspace = true, optional = true }
aws-sdk-bedrockruntime = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true }
# `http-body-1-x`: response bodies of the HTTP/1.1 transport.
aws-smithy-types = { workspace = true, optional = true, features = ["http-body-1-x"] }
google-cloud-aiplatform-v1 = { workspace = true, optional = true }
google-cloud-auth = { workspace = true, optional = true }
google-cloud-gax = { workspace = true, optional = true }

[[bin]]
name = "delta-ai"
path = "src/bin/delta-ai.rs"
required-features = ["cli"]

[dev-dependencies]
aws-smithy-eventstream.workspace = true
google-cloud-gax.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
wiremock.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
