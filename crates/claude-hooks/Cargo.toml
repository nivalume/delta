[package]
name = "delta-claude-hooks"
description = "Claude Code's command and HTTP hooks for delta-harness"
readme = "README.md"
keywords = ["llm", "agent", "hooks", "claude-code"]
categories = ["asynchronous"]
include = ["src/**", "docs/**", "README.md", "LICENSE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "delta_claude_hooks"

[dependencies]
delta-ai.workspace = true
delta-chord.workspace = true
delta-harness.workspace = true
futures.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
