<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The agent loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · delta-agent</p>
    <h1>The agent loop</h1>

    <!-- Replace [diagram-slug] with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 960 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="delta-agent-loop-title delta-agent-loop-desc">
        <title id="delta-agent-loop-title">The agent loop</title>
        <desc id="delta-agent-loop-desc">Each turn appends pending input, prepares and streams a provider request, executes any tool calls, finishes the turn, then continues while steering or follow-up input is queued; a failed response ends the run.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="380" y1="80" x2="380" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="380" y1="176" x2="380" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="380" y1="272" x2="380" y2="312" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<line x1="380" y1="368" x2="380" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="424" y1="440" x2="560" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="480.0" y="420" width="24" height="12" rx="2" fill="#f5f5f5"/>
<text x="492" y="429" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<path d="M 660,468 V 548 Q 660,556 652,556 H 480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="380" y1="484" x2="380" y2="528" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="388" y="500" width="20" height="12" rx="2" fill="#f5f5f5"/>
<text x="398.0" y="509" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<line x1="380" y1="584" x2="380" y2="612" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="380" y1="700" x2="380" y2="752" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="388" y="720" width="20" height="12" rx="2" fill="#f5f5f5"/>
<text x="398.0" y="729" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<path d="M 336,656 H 160 Q 152,656 152,648 V 156 Q 152,148 160,148 H 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="160" y="400" width="24" height="12" rx="2" fill="#f5f5f5"/>
<text x="172.0" y="409" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<path d="M 480,340 H 832 Q 840,340 840,348 V 768 Q 840,776 832,776 H 480" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="618.0" y="320" width="84" height="12" rx="2" fill="#f5f5f5"/>
<text x="660" y="329" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ERROR · ABORTED</text>
<rect x="280" y="32" width="200" height="48" rx="20" fill="#f5f5f5"/>
<rect x="280" y="32" width="200" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
<text x="380.0" y="60.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">prompt · continue_run</text>
<rect x="280" y="120" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="280" y="120" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

<text x="380.0" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">declare_tool_changes</text>
<rect x="280" y="216" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="280" y="216" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="380.0" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Prepare request</text>
<text x="380.0" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">prepare_request</text>
<rect x="280" y="312" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="280" y="312" width="200" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="380.0" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stream response</text>
<text x="380.0" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">StreamFn · MessageUpdate</text>
<polygon points="380,396 424,440 380,484 336,440" fill="#f5f5f5"/>
<polygon points="380,396 424,440 380,484 336,440" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="380" y="444" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Tool calls?</text>
<rect x="560" y="412" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="560" y="412" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="660.0" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Execute tools</text>
<text x="660.0" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">parallel · sequential</text>
<rect x="280" y="528" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="280" y="528" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="380.0" y="552" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Finish turn</text>
<text x="380.0" y="568" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">finish_turn · turn_end</text>
<polygon points="380,612 424,656 380,700 336,656" fill="#f5f5f5"/>
<polygon points="380,612 424,656 380,700 336,656" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="380" y="660" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Queued?</text>
<rect x="280" y="752" width="200" height="48" rx="20" fill="#f5f5f5"/>
<rect x="280" y="752" width="200" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
<text x="380.0" y="780.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">agent_end</text>
<text x="560" y="640" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Steering first; follow-ups only when</text>
<text x="560" y="660" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">no tool call or steering remains.</text>
<line x1="30" y1="844" x2="930" y2="844" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="30" y="864" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="110" y="854" width="24" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
<text x="142" y="864" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Entry / exit</text>
<rect x="230" y="854" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142"/>
<text x="262" y="864" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Step</text>
<polygon points="342,853 350,860 342,867 334,860" fill="#ffffff" stroke="#2d3142"/>
<text x="358" y="864" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Decision</text>

<line x1="580" y1="860" x2="604" y2="860" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="612" y="864" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Failed response ends the run</text>
      </svg>
    </div>
  </div>
</body>
</html>
