<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ownership and abort cascade</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · delta-harness</p>
    <h1>Ownership and abort cascade</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ownership-cascade-title ownership-cascade-desc">
        <title id="ownership-cascade-title">Ownership and abort cascade</title>
        <desc id="ownership-cascade-desc">A conversation abort marks the run generation and every task and conversation it owns, down to a subagent conversation whose queued inputs are withdrawn, while a background compaction and the work it owns are a boundary the cascade does not cross; abort handlers run bottom-up.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors first. Owner edges: trunk, bus with rounded ends, drops. -->
        <line x1="300" y1="68" x2="390" y2="68" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <circle cx="300" cy="68" r="4" fill="#bf4520"/>
        <line x1="480" y1="96" x2="480" y2="128" stroke="#4f5d75" stroke-width="1.2"/>
        <path d="M480 128 H308 a8 8 0 0 0 -8 8 V160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M480 128 H652 a8 8 0 0 1 8 8 V160" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="300" y1="216" x2="300" y2="256" stroke="#4f5d75" stroke-width="1.2"/>
        <path d="M300 256 H178 a8 8 0 0 0 -8 8 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M300 256 H402 a8 8 0 0 1 8 8 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="660" y1="216" x2="660" y2="288" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="410" y1="344" x2="410" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels, masked, clear of their strokes. -->
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle">
          <rect x="321" y="46" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="345" y="55" fill="#bf4520">ABORT()</text>
          <rect x="308" y="226" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="334" y="235" fill="#5a6580">CASCADE</text>
          <rect x="668" y="246" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="694" y="255" fill="#5a6580">SKIPPED</text>
          <rect x="418" y="374" width="46" height="12" rx="2" fill="#f5f5f5"/><text x="441" y="383" fill="#5a6580">OWNS</text>
        </g>

        <!-- Nodes. -->
        <g font-family="'Geist', system-ui, sans-serif" text-anchor="middle">
          <!-- Conversation 1 -->
          <rect x="390" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="390" y="40" width="180" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
          <rect x="398" y="46" width="40" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.4)" stroke-width="0.8"/>
          <text x="418" y="55" fill="rgba(191,69,32,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">ABORTED</text>
          <text x="480" y="74" fill="#2d3142" font-size="12" font-weight="600">Conversation 1</text>
          <text x="480" y="88" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">ownerless · inputs withdrawn</text>

          <!-- Generation -->
          <rect x="200" y="160" width="200" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="200" y="160" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="208" y="166" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
          <text x="228" y="175" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">MARKED</text>
          <text x="300" y="194" fill="#2d3142" font-size="12" font-weight="600">Generation</text>
          <text x="300" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">delta.generation · abort 3rd</text>

          <!-- Background compaction -->
          <rect x="560" y="160" width="200" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="560" y="160" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
          <rect x="568" y="166" width="52" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
          <text x="594" y="175" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">BOUNDARY</text>
          <text x="660" y="194" fill="#2d3142" font-size="12" font-weight="600">Background compaction</text>
          <text x="660" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">background · not marked</text>

          <!-- Tool 1 -->
          <rect x="80" y="288" width="180" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="80" y="288" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="88" y="294" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
          <text x="108" y="303" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">MARKED</text>
          <text x="170" y="322" fill="#2d3142" font-size="12" font-weight="600">Tool call 1</text>
          <text x="170" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">delta.tool · abort 2nd</text>

          <!-- Tool 2 -->
          <rect x="320" y="288" width="180" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="320" y="288" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="328" y="294" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
          <text x="348" y="303" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">MARKED</text>
          <text x="410" y="322" fill="#2d3142" font-size="12" font-weight="600">Tool call 2</text>
          <text x="410" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">delta.tool · abort 2nd</text>

          <!-- Owned work of the background task -->
          <rect x="570" y="288" width="180" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="570" y="288" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="0.8"/>
          <rect x="578" y="294" width="56" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
          <text x="606" y="303" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">UNREACHED</text>
          <text x="660" y="322" fill="#2d3142" font-size="12" font-weight="600">Its owned work</text>
          <text x="660" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">keeps running</text>

          <!-- Subagent conversation -->
          <rect x="320" y="416" width="180" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="320" y="416" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="328" y="422" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
          <text x="350" y="431" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">REACHED</text>
          <text x="410" y="452" fill="#2d3142" font-size="12" font-weight="600">Conversation 2</text>
          <text x="410" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">owned by tool 2 · abort 1st</text>
        </g>

        <!-- Legend strip -->
        <line x1="30" y1="512" x2="930" y2="512" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" fill="#4f5d75" letter-spacing="0.06em">
          <text x="30" y="528" letter-spacing="0.14em">LEGEND</text>
          <rect x="30" y="540" width="22" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="60" y="549">solid · marked by the cascade</text>
          <rect x="300" y="540" width="22" height="12" rx="2" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
          <text x="330" y="549">dashed · background boundary</text>
          <line x1="560" y1="546" x2="590" y2="546" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <text x="600" y="549">owner edge · handlers run bottom-up</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
