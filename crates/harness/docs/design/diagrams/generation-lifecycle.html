<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generation lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State · Lifecycle phase map · delta-harness</p>
    <h1>Generation, tool round, handover</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="generation-lifecycle-title generation-lifecycle-desc">
        <title id="generation-lifecycle-title">Generation, tool round, handover</title>
        <desc id="generation-lifecycle-desc">A delta.generation task moves from prepare to request to a waiting tool round and hands the run to a successor generation; retry and poll are durable sleeps; the terminal outcomes are an answered run, a failed run and an aborted run.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Bands -->
        <rect x="24" y="44" width="952" height="120" rx="8" fill="rgba(79,93,117,0.035)" stroke="rgba(45,49,66,0.12)"/>
        <rect x="24" y="392" width="952" height="120" rx="8" fill="rgba(45,49,66,0.035)" stroke="rgba(45,49,66,0.12)"/>
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" fill="#4f5d75" letter-spacing="0.14em">
          <text x="40" y="60">SLEEPING · RECOVERY</text>
          <text x="40" y="200">PRIMARY PHASES</text>
          <text x="40" y="408">TERMINAL OUTCOMES</text>
        </g>

        <!-- Transitions, drawn before states. -->
        <line x1="204" y1="256" x2="264" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M299 220 V188 a8 8 0 0 0 -8 -8 H165 a8 8 0 0 1 -8 -8 V140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="111" y1="140" x2="111" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="334" y1="220" x2="334" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="369" y1="140" x2="369" y2="220" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="404" y1="256" x2="464" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="604" y1="256" x2="664" y2="256" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="334" y1="292" x2="334" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M369 292 V348 a8 8 0 0 0 8 8 H491 a8 8 0 0 1 8 8 V416" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="534" y1="292" x2="534" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M569 292 V372 a8 8 0 0 0 8 8 H691 a8 8 0 0 1 8 8 V416" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Transition labels on opaque masks, clear of their strokes. -->
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75">
          <rect x="218" y="236" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="234" y="245">PROMPT</text>
          <rect x="207" y="160" width="50" height="12" rx="2" fill="#f5f5f5"/><text x="232" y="169">RETRYABLE</text>
          <rect x="119" y="172" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="131" y="181">DUE</text>
          <rect x="282" y="150" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="304" y="159">DEFERRED</text>
          <rect x="377" y="172" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="395" y="181">RESULT</text>
          <rect x="408" y="236" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="434" y="245">TOOL CALLS</text>
          <rect x="608" y="236" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="634" y="245" fill="#bf4520">POST-TOOLS</text>
          <rect x="342" y="348" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="358" y="357">ERROR</text>
          <rect x="402" y="336" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="434" y="345">STOP / LENGTH</text>
          <rect x="480" y="300" width="50" height="12" rx="2" fill="#f5f5f5"/><text x="505" y="309">TERMINATE</text>
          <rect x="608" y="360" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="634" y="369">ABORT MARK</text>
        </g>

        <!-- Primary rail -->
        <g font-family="'Geist', system-ui, sans-serif" text-anchor="middle">
          <g><rect x="64" y="220" width="140" height="72" rx="8" fill="#ffffff" stroke="#2d3142"/><text x="134" y="251" fill="#2d3142" font-size="12" font-weight="600">Prepare</text><text x="134" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">agent · delta.system</text></g>
          <g><rect x="264" y="220" width="140" height="72" rx="8" fill="#ffffff" stroke="#2d3142"/><text x="334" y="251" fill="#2d3142" font-size="12" font-weight="600">Request</text><text x="334" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">stream · partials</text></g>
          <g><rect x="464" y="220" width="140" height="72" rx="8" fill="#ffffff" stroke="#2d3142"/><rect x="474" y="228" width="44" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/><text x="496" y="237" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">WAITING</text><text x="534" y="259" fill="#2d3142" font-size="12" font-weight="600">Tool round</text><text x="534" y="276" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">owns delta.tool tasks</text></g>
          <g><rect x="664" y="220" width="140" height="72" rx="8" fill="#ffffff" stroke="#2d3142"/><rect x="674" y="228" width="52" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/><text x="700" y="237" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">HANDOVER</text><text x="734" y="259" fill="#2d3142" font-size="12" font-weight="600">Next generation</text><text x="734" y="276" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">delta.live.run moves on</text></g>
        </g>

        <!-- Sleeping states -->
        <g text-anchor="middle">
          <g><rect x="64" y="68" width="140" height="72" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-dasharray="5,4"/><rect x="74" y="76" width="34" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="91" y="85" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace">SLEEP</text><text x="134" y="109" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Retry</text><text x="134" y="124" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">sleeps until backoff</text></g>
          <g><rect x="264" y="68" width="140" height="72" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-dasharray="5,4"/><rect x="274" y="76" width="34" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="291" y="85" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace">SLEEP</text><text x="334" y="109" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Poll</text><text x="334" y="124" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">fetch_deferred at poll_at</text></g>
        </g>

        <!-- Terminal outcomes -->
        <g text-anchor="middle">
          <g><rect x="264" y="416" width="140" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="3,3"/><rect x="274" y="424" width="54" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="301" y="433" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace">TERMINAL</text><text x="334" y="457" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Failed</text><text x="334" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">no_model · model_error</text></g>
          <g><rect x="464" y="416" width="140" height="72" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><circle cx="486" cy="440" r="7" fill="none" stroke="#bf4520"/><circle cx="486" cy="440" r="4" fill="#bf4520"/><text x="546" y="457" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Answered</text><text x="534" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">inputs done · boundary</text></g>
          <g><rect x="664" y="416" width="140" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75"/><rect x="674" y="424" width="54" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="701" y="433" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace">TERMINAL</text><text x="734" y="457" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Aborted</text><text x="734" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">after owned tools drain</text></g>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
